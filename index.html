<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#174b9b">
    <meta name="description" content="Kamper og resultater for Varegg/Sandviken under Norway Cup 2026.">
    <title>Varegg/Sandviken · Norway Cup 2026</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="hero">
      <div class="hero__inner">
        <div class="eyebrow"><span class="eyebrow__dot"></span> Norway Cup 2026</div>
        <h1><span class="club-varegg">Varegg</span> <span class="club-slash">/</span> <span class="club-sandviken">Sandviken</span></h1>
        <p>Kamper, baner og resultater samlet på ett sted.</p>
        <div class="hero__meta">
          <span id="update-status">Henter siste resultater …</span>
          <button id="refresh-button" class="refresh" type="button" aria-label="Oppdater resultater">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5M18.5 9A7 7 0 0 0 6.2 6.2L4 9m16 6-2.2 2.8A7 7 0 0 1 5.5 15"/></svg>
            Oppdater
          </button>
        </div>
      </div>
    </header>

    <main>
      <section id="next-match" class="next-match" aria-live="polite"></section>

      <nav class="view-nav" aria-label="Velg visning">
        <label for="view-select">Vis kamper for</label>
        <div class="view-nav__controls">
          <select id="view-select" aria-label="Velg lag eller årskull"></select>
          <button id="favorite-button" class="favorite-button" type="button">★ Velg favoritter</button>
        </div>
      </nav>

      <dialog id="favorites-dialog" class="favorites-dialog">
        <form method="dialog">
          <div class="favorites-dialog__header">
            <div><span class="eyebrow-dialog">Min oversikt</span><h2>Velg favoritter</h2></div>
            <button class="dialog-close" value="cancel" aria-label="Lukk" type="submit">×</button>
          </div>
          <p>Velg lagene du vil samle under visningen «Favoritter».</p>
          <div id="favorite-options" class="favorite-options"></div>
          <button class="dialog-done" value="done" type="submit">Ferdig</button>
        </form>
      </dialog>

      <div class="toolbar">
        <div id="status-buttons" class="filters" aria-label="Filtrer kamper">
          <button class="filter is-active" data-status="all" type="button">Alle</button>
          <button class="filter" data-status="upcoming" type="button">Kommende</button>
          <button class="filter" data-status="finished" type="button">Resultater</button>
        </div>
        <p id="match-count" class="match-count"></p>
      </div>

      <section id="matches" class="matches" aria-live="polite">
        <div class="loading"><span></span><span></span><span></span></div>
      </section>
    </main>

    <footer>
      <p>Uoffisiell resultatoversikt for Varegg/Sandviken.</p>
      <a href="https://norwaycup.no/" rel="noreferrer">Norway Cup</a>
    </footer>

    <template id="match-template">
      <article class="match-card">
        <div class="match-card__meta">
          <time></time>
          <div class="match-card__labels">
            <span class="class-pill"></span>
            <span class="status-pill"></span>
          </div>
        </div>
        <div class="teams">
          <div class="team team--home"><a class="team__name" target="_blank" rel="noreferrer"></a><strong class="team__score"></strong></div>
          <div class="team team--away"><a class="team__name" target="_blank" rel="noreferrer"></a><strong class="team__score"></strong></div>
        </div>
        <div class="match-card__footer">
          <span class="arena"></span>
          <span class="group"></span>
          <a class="match-link" target="_blank" rel="noreferrer">Kampside ↗</a>
        </div>
      </article>
    </template>
  </body>
</html>
